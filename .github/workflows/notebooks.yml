name: Check notebooks

on:
  push:
    paths: ["**.ipynb", "requirements.txt", "tools/**", ".github/workflows/notebooks.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Check structure and execute the lecture book
        env:
          MPLBACKEND: Agg
        run: python tools/check_notebooks.py
